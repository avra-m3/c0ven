# Publishes guides/ to GitHub Pages from main (ADR-0047). The logo is copied beside it, where the pages' relative
# link finds it.
name: guides

on:
  push:
    branches: [main]
    paths: [guides/**, docs/images/logo.svg, .github/workflows/guides.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage the site
        run: |
          mkdir -p _site/docs/images
          cp -r guides _site/guides
          cp docs/images/logo.svg _site/docs/images/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=guides/"><a href="guides/">C0ven guides</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
