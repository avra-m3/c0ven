<!DOCTYPE html>
<!-- Coven Hollow: a three.js scene drawn entirely by code: witches, cottages, a garden, a pond at dusk.
     Every part repeats every 8 s, so a recording of it loops with no seam; "?pump" hands the clock to a
     capture script one frame at a time (docs/guides/recreate-coven-hollow.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coven Hollow — a witch coven's corner of the world</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#152a24}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:22px;left:26px;color:#f6ead0;font-family:Georgia,'Times New Roman',serif;pointer-events:none;z-index:5}
  #ui h1{margin:0;font-size:30px;font-weight:400;font-style:italic;letter-spacing:1.5px;text-shadow:0 2px 22px rgba(15,35,30,.9)}
  #ui p{margin:5px 0 0;font-size:13.5px;opacity:.78;letter-spacing:.5px}
  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:999px;
        background:rgba(25,55,48,.55);border:1px solid rgba(246,234,208,.25);color:#f6ead0;
        font-family:Georgia,serif;font-style:italic;font-size:13.5px;letter-spacing:.6px;
        backdrop-filter:blur(6px);z-index:5;pointer-events:none}
  #veil{position:fixed;inset:0;pointer-events:none;z-index:4;
        background:radial-gradient(125% 95% at 50% 42%, transparent 55%, rgba(16,34,29,.55) 100%)}
  #fade{position:fixed;inset:0;background:#152a24;z-index:9;pointer-events:none;animation:fo 1.8s .25s forwards}
  @keyframes fo{to{opacity:0}}
  #err{position:fixed;bottom:10px;right:10px;max-width:46ch;color:#ffd9a6;background:rgba(20,40,35,.9);
       font:11px/1.4 monospace;padding:8px 10px;border-radius:8px;display:none;z-index:20;white-space:pre-wrap}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="ui"><h1>Coven Hollow</h1><p>a cozy corner of the world, where the kettle is always on</p></div>
<div id="hint">drag to look around &nbsp;·&nbsp; click to cast a spark</div>
<div id="veil"></div>
<div id="fade"></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls }      from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }     from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }         from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }    from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }         from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries }    from 'three/addons/utils/BufferGeometryUtils.js';

window.addEventListener('error', e => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = (e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
});

/* ---------------------------------------------------------------- palette
   #1F3B34 deep forest teal is the backbone: roofs, pines, robes, shadows,
   hills, the zenith sky. Everything else warms around it — the hearth glow
   (honey/amber/cream) against the cool teal of wood and magic.            */
const PAL = {
  teal:     0x1f3b34, tealDark: 0x152a24, tealSoft: 0x2c5449,
  pine:     0x24463c, sage:     0x87ab8c, moss:     0x5d8a67, fern: 0x6fa377,
  cream:    0xf6ead0, parchment:0xeedeca,
};
PAL.wood     = 0x8a6a4b; PAL.woodDark = 0x6b4f38; PAL.straw = 0xdfc27d;
PAL.stone    = 0x9fb0a6; PAL.blush    = 0xe09a9a; PAL.honey = 0xf2b24c;
PAL.amber    = 0xff9a5c; PAL.gold     = 0xd9a441; PAL.magic = 0x7ce8c4;
PAL.iron     = 0x27352f; PAL.rosewood = 0xa86a62;

/* deterministic little dice so the hollow is the same every visit */
let _s = 20261024;
const rand = () => { _s = (_s * 16807) % 2147483647; return (_s - 1) / 2147483646; };
const rr   = (a, b) => a + (b - a) * rand();

const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function stdMat(color, o = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: o.rough ?? 0.95, metalness: o.metal ?? 0,
    flatShading: o.flat !== false, vertexColors: !!o.vertexColors,
    emissive: o.emissive ?? 0x000000, emissiveIntensity: o.ei ?? 1,
    transparent: !!o.transparent, opacity: o.opacity ?? 1,
    side: o.side ?? THREE.FrontSide,
  });
}
function jitter(g, a) {
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++)
    p.setXYZ(i, p.getX(i) + (rand() - .5) * a, p.getY(i) + (rand() - .5) * a, p.getZ(i) + (rand() - .5) * a);
  g.computeVertexNormals();
  return g;
}
function paint(g, hex) { // vertex colors so merged blobs can vary per part
  const c = new THREE.Color(hex);
  const n = g.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i*3] = c.r; arr[i*3+1] = c.g; arr[i*3+2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}
function pivot(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }

/* materials with a uTime uniform get ticked every frame */
const timed = [];
const addTime = m => { timed.push({ uniform: m.uniforms.uTime, mat: m }); return m; };

/* ---------------------------------------------------------------- renderer */
const PUMP = new URLSearchParams(location.search).has('pump'); // deterministic frame-stepping for GIF capture
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: PUMP });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0xc2946a, 0.0065);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 22, 48); // matches the intro dolly start

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 7; controls.maxDistance = 40;
controls.maxPolarAngle = 1.47;
controls.autoRotateSpeed = 0.35;

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.setSize(innerWidth, innerHeight);

/* ---------------------------------------------------------------- light
   low golden-hour sun from behind the far hills, warm haze, teal bounce.  */
const sunDir = new THREE.Vector3(-0.55, 0.21, -0.80).normalize();
const sun = new THREE.DirectionalLight(0xffd9a1, 2.7);
sun.position.copy(sunDir).multiplyScalar(70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
sun.shadow.camera.top  =  26; sun.shadow.camera.bottom = -26;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 170;
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

scene.add(new THREE.HemisphereLight(0xffd7ae, PAL.tealDark, 1.0));
scene.add(new THREE.AmbientLight(0x2a4a40, 0.6));

/* ---------------------------------------------------------------- sky */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 }, uSun: { value: sunDir } },
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSun; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main(){
      vec3 d = normalize(vDir);
      float t = clamp(d.y, 0.0, 1.0);
      vec3 horizon = vec3(0.94, 0.70, 0.46);         // apricot hour
      vec3 mid     = vec3(0.42, 0.60, 0.53);         // sage band
      vec3 top     = vec3(0.105, 0.208, 0.188);      // #1F3B34 zenith
      vec3 col = mix(horizon, mid, smoothstep(0.02, 0.34, t));
      col = mix(col, top, smoothstep(0.26, 0.85, t));
      col = mix(vec3(0.85, 0.62, 0.42), col, smoothstep(-0.08, 0.02, d.y));
      float sd = max(dot(d, uSun), 0.0);
      col += vec3(1.0, 0.60, 0.31) * pow(sd, 10.0) * 0.30;
      col += vec3(1.0, 0.84, 0.58) * pow(sd, 220.0) * 0.75;
      if (t > 0.12) {                                // first evening stars
        vec2 g = floor(vec2(atan(d.z, d.x), d.y * 2.0) * 260.0);
        float s = step(0.9975, hash(g));
        float tw = 0.5 + 0.5 * sin(uTime * (floor((1.5 + hash(g + 3.0) * 3.0) / 0.7854 + 0.5) * 0.7854) + hash(g + 7.0) * 20.0);
        col += s * tw * vec3(0.9, 0.95, 1.0) * smoothstep(0.15, 0.55, t) * 0.9;
      }
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(420, 40, 24), addTime(skyMat)));

/* the sun itself, just above the far hills */
const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(9, 24),
  new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(1.4, 1.0, 0.62), fog: false, toneMapped: false, transparent: true, opacity: 0.75 })
);
sunDisc.position.copy(sunDir).multiplyScalar(360);
sunDisc.lookAt(0, 0, 0);
scene.add(sunDisc);

/* a shy crescent moon on the other side of the dusk */
const moonMat = new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime; varying vec2 vUv;
    void main(){
      vec2 p = vUv - 0.5;
      float a = smoothstep(0.50, 0.47, length(p));
      float b = smoothstep(0.44, 0.41, length(p - vec2(0.20, 0.12)));
      float m = clamp(a - b, 0.0, 1.0);
      float glow = exp(-length(p) * 4.5) * 0.28 * (0.9 + 0.1 * sin(uTime));
      gl_FragColor = vec4(vec3(1.0, 0.97, 0.86) * (m * 1.9 + glow), m + glow);
    }`
});
const moon = new THREE.Mesh(new THREE.CircleGeometry(10, 32), addTime(moonMat));
moon.position.set(0.52, 0.48, 0.70).normalize().multiplyScalar(360);
moon.lookAt(0, 0, 0);
scene.add(moon);

/* drifting clouds */
const cloudMat = stdMat(0xffe6cd, { rough: 1 });
const clouds = [];
const cloudGeo = (() => {
  const parts = [];
  for (let i = 0; i < 7; i++) {
    const g = new THREE.SphereGeometry(1, 7, 6);
    g.scale(rr(1, 2.4), rr(0.6, 1.0), rr(0.9, 1.7));
    g.translate(rr(-3.2, 3.2), rr(-0.4, 0.5), rr(-1.6, 1.6));
    parts.push(g);
  }
  return mergeGeometries(parts);
})();
for (let i = 0; i < 6; i++) {
  const c = new THREE.Mesh(cloudGeo, cloudMat);
  c.position.set(rr(-70, 70), rr(26, 40), rr(-55, -12));
  c.scale.setScalar(rr(2.2, 4.2));
  c.userData.speed = rr(0.25, 0.55);
  c.userData.x0 = c.position.x;            // clouds bob in place: pure 8 s oscillation, loop-safe
  c.userData.cph = rr(0, 6.283);
  clouds.push(c); scene.add(c);
}

/* ---------------------------------------------------------------- terrain
   a flat clearing in the middle, rolling land beyond, a bowl for the pond,
   and flattened pads so each cottage sits level.                          */
const POND = new THREE.Vector2(12, 11), POND_R = 6.4, WATER_Y = -0.55;
function natural(x, z) {
  const r = Math.hypot(x, z);
  const roll = Math.sin(x * 0.13 + 2.1) * Math.cos(z * 0.11 - 0.7) * 1.7
             + Math.sin(x * 0.29 - 1.0) * Math.sin(z * 0.25 + 0.5) * 0.6;
  let h = roll * smoothstep(7, 20, r);
  h += smoothstep(16, 58, r) * (5.5 + Math.sin(x * 0.07 + 1.3) * 2.2 + Math.cos(z * 0.08 - 0.4) * 2.0);
  const pd = Math.hypot(x - POND.x, z - POND.y);
  h -= 1.7 * (1 - smoothstep(4.0, 7.4, pd));
  return h;
}
const HOUSES = [
  { x: -12, z: -7, rot: 0 },
  { x:  13, z: -9, rot: 0 },
  { x:  -3, z: 15, rot: 0 },
];
const pads = HOUSES.map(h => ({ x: h.x, z: h.z, r: 7, h: natural(h.x, h.z) }));
function groundH(x, z) {
  let h = natural(x, z);
  for (const p of pads) {
    const f = smoothstep(p.r * 0.5, p.r * 1.2, Math.hypot(x - p.x, z - p.z));
    h = p.h + (h - p.h) * f;
  }
  return h;
}
const keepOut = [
  { x: 0, z: 0, r: 1.8 },                                   // cauldron
  ...HOUSES.map(h => ({ x: h.x, z: h.z, r: 2.9 })),         // cottages
  { x: POND.x, z: POND.y, r: 6.6 },                         // pond
];
const onKeepOut = (x, z) => keepOut.some(k => (x - k.x) ** 2 + (z - k.z) ** 2 < k.r * k.r);

{
  const g = new THREE.PlaneGeometry(160, 160, 120, 120);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cLo = new THREE.Color(0x2f5347), cHi = new THREE.Color(0x5d8163),
        cClear = new THREE.Color(0x6d8f6d), cMud = new THREE.Color(0x3c5c52);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = groundH(x, z);
    pos.setY(i, h);
    tmp.copy(cLo).lerp(cHi, smoothstep(-0.5, 2.5, h));
    tmp.lerp(cClear, 0.45 * (1 - smoothstep(6, 13, Math.hypot(x, z))));
    const pd = Math.hypot(x - POND.x, z - POND.y);
    tmp.lerp(cMud, 0.5 * smoothstep(8.4, 6.4, pd) * (1 - smoothstep(4.2, 2.8, pd)));
    tmp.offsetHSL(0, 0, (rand() - 0.5) * 0.045);
    col[i*3] = tmp.r; col[i*3+1] = tmp.g; col[i*3+2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
  m.receiveShadow = true;
  scene.add(m);
}

/* ---------------------------------------------------------------- water
   analytic sine ripples + click ripples, normals derived in the fragment
   shader; teal body, peach sky in the glancing reflections.               */
const RIP_MAX = 6;
let ripSlot = 0;
const waterUniforms = {
  uTime: { value: 0 },
  uSun:  { value: sunDir },
  uRip:  { value: Array.from({ length: RIP_MAX }, () => new THREE.Vector4(0, 0, -99, 0)) },
};
const waterMat = new THREE.ShaderMaterial({
  transparent: true, uniforms: waterUniforms,
  vertexShader: `
    varying vec3 vW;
    void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSun; uniform vec4 uRip[${RIP_MAX}]; varying vec3 vW;
    float wh(vec2 p){
      float h = sin(p.x*1.7 + uTime*0.7854)*0.05 + sin(p.y*2.1 - uTime*1.5708)*0.04
              + sin((p.x+p.y)*2.6 + uTime*1.5708)*0.025;
      for (int i = 0; i < ${RIP_MAX}; i++) {
        vec4 r = uRip[i]; float t = uTime - r.z;
        if (t > 0.0 && t < 4.0) {
          float d = distance(p, r.xy);
          h += sin(d*9.0 - t*11.0) * exp(-d*0.5) * exp(-t*0.85) * 0.12;
        }
      }
      return h;
    }
    void main(){
      float e = 0.12;
      float hx = wh(vW.xz + vec2(e,0.0)) - wh(vW.xz - vec2(e,0.0));
      float hz = wh(vW.xz + vec2(0.0,e)) - wh(vW.xz - vec2(0.0,e));
      vec3 N = normalize(vec3(-hx/(2.0*e), 1.0, -hz/(2.0*e)));
      vec3 V = normalize(cameraPosition - vW);
      vec3 col = mix(vec3(0.10,0.22,0.19), vec3(0.22,0.40,0.33),
                     0.45 + 0.25*sin(vW.x*0.9 + vW.z*0.7 + uTime*0.7854));
      vec3 sky = vec3(0.72, 0.66, 0.55);
      float f = pow(1.0 - max(dot(N,V),0.0), 3.0);
      col = mix(col, sky, f*0.35);
      vec3 H = normalize(uSun + V);
      float nd = max(dot(N,H),0.0);
      col += vec3(1.0,0.88,0.66) * (pow(nd,220.0)*2.4 + pow(nd,16.0)*0.10);
      gl_FragColor = vec4(col, 0.93);
    }`
});
addTime(waterMat);
const water = new THREE.Mesh(new THREE.CircleGeometry(POND_R, 64), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.set(POND.x, WATER_Y, POND.y);
scene.add(water);

function addRipple(x, z) {
  waterUniforms.uRip.value[ripSlot].set(x, z, clock.elapsedTime, 1);
  ripSlot = (ripSlot + 1) % RIP_MAX;
}

/* ---------------------------------------------------------------- grass,
   flowers, reeds: instanced blades with wind baked into the vertex shader. */
function bladeGeo(h) { // cross of two tapered quads: reads as volume, catches the low sun
  const g = new THREE.BufferGeometry();
  const w = 0.045, w2 = 0.013;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    -w, 0, 0,  w, 0, 0,  -w2, 0.5 * h, 0,  w2, 0.5 * h, 0,  0, h, 0,
     0, 0, -w,  0, 0, w,  0, 0.5 * h, -w2,  0, 0.5 * h, w2,  0, h, 0,
  ]), 3));
  g.setIndex([0, 1, 2, 1, 3, 2, 2, 3, 4, 5, 6, 7, 6, 8, 7, 7, 8, 9]);
  g.computeVertexNormals();
  // bias normals upward: thin vertical quads otherwise read black in low sun
  const nrm = g.attributes.normal;
  for (let i = 0; i < nrm.count; i++) {
    nrm.setY(i, Math.max(nrm.getY(i), 0.45));
    const x = nrm.getX(i), y = nrm.getY(i), z = nrm.getZ(i);
    const l = Math.hypot(x, y, z) || 1;
    nrm.setXYZ(i, x / l, y / l, z / l);
  }
  return g;
}
function windMat(base, opts = {}) {
  const { windH = 1, windAmp = 1, ...rest } = opts; // windH = plant's local height so bend stays normalized
  const m = stdMat(base, { side: THREE.DoubleSide, ...rest });
  m.userData.uTime = { value: 0 };
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = m.userData.uTime;
    sh.uniforms.uWindH = { value: windH };
    sh.uniforms.uWindAmp = { value: windAmp };
    sh.vertexShader = 'uniform float uTime; uniform float uWindH; uniform float uWindAmp;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      `#ifdef USE_INSTANCING
         vec3 iwp = instanceMatrix[3].xyz;
       #else
         vec3 iwp = modelMatrix[3].xyz;
       #endif
       float ph = iwp.x*0.55 + iwp.z*0.47;
       float bend = pow(clamp(transformed.y / uWindH, 0.0, 1.0), 2.0) * uWindAmp;
       transformed.x += (sin(uTime*1.5708 + ph) * 0.22 + sin(uTime*3.1416 + ph*1.7) * 0.07) * bend;
       transformed.z += cos(uTime*0.7854 + ph*0.8) * 0.16 * bend;
       #include <project_vertex>`);
  };
  timed.push({ uniform: m.userData.uTime });
  return m;
}
{
  const count = 3600;
  const mesh = new THREE.InstancedMesh(bladeGeo(1), windMat(0x6f9a68), count);
  const d = new THREE.Object3D(); const c = new THREE.Color();
  let n = 0;
  while (n < count) {
    const x = rr(-25, 25), z = rr(-24, 25);
    if (onKeepOut(x, z)) continue;
    if (Math.hypot(x, z) > 23) continue;
    d.position.set(x, groundH(x, z) - 0.02, z);
    d.rotation.set(rr(-0.08, 0.08), rr(0, Math.PI * 2), rr(-0.08, 0.08));
    const s = rr(0.32, 0.60);
    d.scale.set(rr(0.8, 1.3), s, 1);
    d.updateMatrix();
    mesh.setMatrixAt(n, d.matrix);
    c.setHSL(0.28 + rand() * 0.06, 0.38 + rand() * 0.14, 0.45 + rand() * 0.16);
    if (Math.hypot(x, z) < 10) c.offsetHSL(0, 0.02, 0.06);
    mesh.setColorAt(n, c);
    n++;
  }
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}
{ // reeds hugging the pond
  const count = 110;
  const mesh = new THREE.InstancedMesh(bladeGeo(1), windMat(0x6b9a76, { windH: 1.2 }), count);
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = rr(0, Math.PI * 2), r = rr(5.6, 7.3);
    const x = POND.x + Math.cos(a) * r, z = POND.y + Math.sin(a) * r;

/* small emissive-pulse helper: makes emissive materials breathe with time */
function pulseEmissive(m, speed = 1.5708, lo = 0.55, hi = 1.25) {
  m.userData.uPulse = { value: 0 };
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = m.userData.uPulse;
    sh.vertexShader = 'uniform float uTime;\nvarying float vPulse;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      `#ifdef USE_INSTANCING
         vec3 wp = instanceMatrix[3].xyz;
       #else
         vec3 wp = modelMatrix[3].xyz;
       #endif
       vPulse = ${lo} + ${hi - lo} * (0.5 + 0.5 * sin(uTime * ${speed} + wp.x * 1.7 + wp.z * 2.3));
       #include <project_vertex>`);
    sh.fragmentShader = 'varying float vPulse;\nuniform float uTime;\n' + sh.fragmentShader.replace(
      '#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n totalEmissiveRadiance *= vPulse;');
  };
  timed.push({ uniform: m.userData.uPulse });
  return m;
}

function spark(x, y, z, hex, opts = {}) {
  const i = sparks.cursor; sparks.cursor = (sparks.cursor + 1) % SPARK_MAX;
  const sp = opts.speed ?? 1.2, up = opts.up ?? 0.7, life = opts.life ?? (0.7 + rand() * 0.7);

function updateSparks(dt) {

    sparks.life[i] -= dt;

    blush.position.set(ex * 1.55, -0.06, 0.215);

  const band = new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.035, 6, 14), stdMat(trimHex));

  hatPivot.add(band);

  star.position.set(0, 0.25, 0.31);
  hatPivot.add(star);

  const arms = [];

const flameRefs = cauldronG.userData.flames;
let cauldronEmit = 0, gossipT = 4, wrenTrail = 0;
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();

/* one 8 s lap of the scene; every frequency is a multiple of 2*pi/8 so state(t) == state(t+8) */
const camCurve = PUMP ? new THREE.CatmullRomCurve3([
  new THREE.Vector3( 4, 7.3, 23),   new THREE.Vector3(-4, 8.0, 21.5),
  new THREE.Vector3(-9, 8.8, 15),   new THREE.Vector3(-6, 9.2, 8.5),
  new THREE.Vector3( 1, 9.0, 7),    new THREE.Vector3( 8, 8.6, 10),
  new THREE.Vector3(10, 8.0, 18),   new THREE.Vector3( 8, 7.5, 22.5),
], true, 'centripetal') : null; // closed: one glide-circuit per lap, seam-exact
const camPos = new THREE.Vector3();
let _lap = 0;
const _rngSeed0 = _s;
function tick(dt, t) {
  const lap = Math.floor(t / 8);
  if (lap !== _lap) { // rewind RNG and event timers so each lap replays identically
    _lap = lap;
    if (PUMP) {
      _s = _rngSeed0; cauldronEmit = 0; gossipT = 4; wrenTrail = 0;
      frog.userData.nextHop = 2; frog.userData.hopN = 0;
    }
  }

  for (const o of timed) o.uniform.value = t;

  /* intro dolly for the first few seconds */
  if (!PUMP && t < 4.2) {
    const e = 1 - Math.pow(1 - Math.min(t / 4.2, 1), 3);
    camera.position.lerpVectors(new THREE.Vector3(0, 22, 48), new THREE.Vector3(3, 7.5, 23.5), e * 0.35 + e * e * 0.65);
    const floorY = groundH(camera.position.x, camera.position.z) + 2.5; // never clip the hillside
    if (camera.position.y < floorY) camera.position.y = floorY;
  }
  if (!PUMP && performance.now() - lastInput > 9000 && t > 6) controls.autoRotate = true;
  controls.update();

  /* clouds bob in place */
  for (const c of clouds) c.position.x = c.userData.x0 + Math.sin(t * 0.7854 + c.userData.cph) * 1.6;

  /* fire flicker + hearth light */
  cauldronLight.intensity = 24 + Math.sin(t * 9.4248) * 3 + Math.sin(t * 23.5619) * 2;
  const flick = 1 + Math.sin(t * 8.6394) * 0.05 + Math.sin(t * 19.635) * 0.04;
  windowMat.emissiveIntensity = 2.4 * flick;
  lampMat.emissiveIntensity = 2.6 * flick;
  for (const L of porchLights) L.intensity = 9 * flick;
  for (const L of postLights) L.intensity = 7 * (1 + Math.sin(t * 7.854 + L.position.x) * 0.06);
  for (const pv of flameRefs) {
    const ph = pv.userData.phase;
    pv.scale.set(0.85 + 0.25 * Math.sin(t * 10.9956 + ph), 1 + 0.35 * Math.sin(t * 13.3518 + ph * 2), 0.85 + 0.25 * Math.cos(t * 11.781 + ph));
  }

  /* lanterns and herbs sway on their pivots */
  for (const pv of lanternPivots) pv.rotation.z = Math.sin(t * 1.5708 + pv.userData.phase) * 0.07;
  for (const pv of swayers) pv.rotation.z = (pv.userData.baseTilt || 0) + Math.sin(t * 0.7854 + pv.userData.phase) * 0.035;
  const willow = TREES.find(g => g.userData.isWillow);
  if (willow) for (const pv of willow.userData.strands) {
    pv.rotation.z = Math.sin(t * 1.5708 + pv.userData.phase) * 0.1;
    pv.rotation.x = Math.sin(t * 0.7854 + pv.userData.phase * 1.7) * 0.07;
  }
  if (signStar) signStar.rotation.y = t * 0.7854;

  /* Miso stirs */
  const sA = t * 2.3562;
  witchA.armR.rotation.x = -1.18 + Math.sin(sA) * 0.24;
  witchA.armR.rotation.z = 0.5 + Math.cos(sA) * 0.26;
  witchA.armL.rotation.x = -0.5 + Math.sin(t * 0.7854) * 0.05;
  witchA.armL.rotation.z = 0.25;
  witchA.g.position.y = groundH(1.7, 1.35) + Math.sin(t * 1.5708) * 0.03;
  witchA.head.rotation.y = Math.sin(t * 0.7854) * 0.25;
  witchA.hatPivot.rotation.z = Math.sin(t * 1.5708 + witchA.hatPivot.userData.phase) * 0.05;
  /* occasional breath of sparkle off the brew */
  cauldronEmit -= dt;
  if (cauldronEmit <= 0) {
    cauldronEmit = 0.5;
    for (let k = 0; k < 2; k++) spark(rr(-0.5, 0.5), 1.14, rr(-0.5, 0.5), k ? PAL.magic : PAL.honey, { speed: 0.35, up: 0.9, life: rr(0.7, 1.2) });
  }

  /* Pip tends: hands up, orb breathing, gossip arcs to Miso */
  witchB.armL.rotation.x = -2.25 + Math.sin(t * 1.5708) * 0.1;
  witchB.armR.rotation.x = -2.15 + Math.sin(t * 1.5708 + 0.7) * 0.1;
  witchB.armL.rotation.z = 0.45; witchB.armR.rotation.z = -0.45;
  witchB.orb.position.y = 2.5 + Math.sin(t * 2.3562) * 0.15;
  witchB.orb.scale.setScalar(1 + Math.sin(t * 2.3562) * 0.12);
  witchB.g.position.y = groundH(-6.2, 4.4) + Math.sin(t * 1.5708 + 1) * 0.03;
  witchB.head.rotation.y = Math.sin(t * 0.7854) * 0.2 - 0.3;
  witchB.hatPivot.rotation.x = Math.sin(t * 1.5708 + witchB.hatPivot.userData.phase) * 0.05;
  gossipT -= dt;
  if (gossipT <= 0) {
    gossipT = 4;
    witchA.head.getWorldPosition(tmpV);
    witchB.head.getWorldPosition(tmpV2);
    if (rand() < 0.5) sparkArc(tmpV, tmpV2, PAL.blush, 5);
    else sparkArc(tmpV2, tmpV, PAL.honey, 5);
  }

  /* Wren's loop around the hollow — one full circuit per 8 s lap */
  const a = t * 0.7854;
  const rad = 13 + 2.2 * Math.sin(t * 0.7854);
  const px = Math.cos(a) * rad, pz = Math.sin(a) * (rad - 1.5);
  const py = 7.0 + 1.2 * Math.sin(t * 0.7854) + 0.5 * Math.sin(t * 1.5708);
  broom.position.set(px, py, pz);
  tmpV.set(Math.cos(a + 0.06) * (13 + 2.2 * Math.sin((t + 0.12) * 0.7854)),
           py + 0.15,
           Math.sin(a + 0.06) * ((13 + 2.2 * Math.sin((t + 0.12) * 0.7854)) - 1.5));
  broom.lookAt(tmpV);
  broom.rotateZ(Math.sin(t * 0.7854) * 0.28);
  witchC.hatPivot.rotation.z = Math.sin(t * 3.1416) * 0.08;
  const legL = witchC.g.userData.legL, legR = witchC.g.userData.legR;
  legL.rotation.x = Math.sin(t * 2.3562) * 0.2 - 0.25;
  legR.rotation.x = Math.sin(t * 2.3562 + 1.4) * 0.2 - 0.25;
  witchC.armL.rotation.x = -2.3 + (Math.sin(t * 0.7854) > 0.8 ? Math.sin(t * 14.1372) * 0.45 : 0);
  wrenTrail -= dt;
  if (wrenTrail <= 0) {
    wrenTrail = 8 / 62;
    tmpV.set(0, 0.05, -1.9).applyQuaternion(broom.quaternion).add(broom.position);
    spark(tmpV.x, tmpV.y, tmpV.z, rand() < 0.55 ? PAL.magic : PAL.parchment, { speed: 0.15, up: 0.25, life: rr(1.1, 1.9), size: rr(0.08, 0.15) });
  }

  /* ingredients spiral into the brew — one spiral per 8 s lap */
  for (const ig of ingredients) {
    const u = (t * 0.125 + ig.off) % 1;
    const oneMinus = 1 - u;
    tmpV.set(
      oneMinus * oneMinus * ig.a.x + 2 * oneMinus * u * ig.ctrl.x + u * u * ig.b.x,
      oneMinus * oneMinus * ig.a.y + 2 * oneMinus * u * ig.ctrl.y + u * u * ig.b.y,
      oneMinus * oneMinus * ig.a.z + 2 * oneMinus * u * ig.ctrl.z + u * u * ig.b.z
    );
    const wob = Math.sin(u * 22 + ig.off * 40) * 0.14;
    tmpV.x += wob; tmpV.z += wob * 0.7;
    ig.item.position.copy(tmpV);
    ig.item.rotation.x = t * 1.5708 + ig.off * 10;
    ig.item.rotation.y = t * 1.5708;
    const sc = Math.sin(u * Math.PI);
    ig.item.scale.setScalar(0.001 + sc);
  }

  /* cat tail, owl, frog */
  if (catRef) catRef.userData.tail.rotation.z = Math.sin(t * 1.5708) * 0.5;
  if (owlRef) {
    const hp = owlRef.userData.headPivot;
    const target = Math.sin(t * 0.7854) * 0.7;
    hp.rotation.y += (target - hp.rotation.y) * dt * 1.5;
    const blink = Math.sin(t * 0.7854) > 0.995 ? 0.12 : 1;
    for (const e of owlRef.userData.eyes) e.scale.y = blink;
  }
  frog.userData.nextHop -= dt;
  if (frog.userData.nextHop <= 0) {
    frog.userData.nextHop = 2; // three hops per 8 s lap, phase-reset at the wrap
    frog.userData.hopT = 0;
    frog.userData.hopN = (frog.userData.hopN || 0) + 1; // alternate direction: the frog patrols its stone
    frog.userData.dir = (frog.userData.hopN % 2 ? 1 : -1) * rr(0.4, 1);
    addRipple(frog.position.x, frog.position.z);
    for (let k = 0; k < 6; k++) spark(frog.position.x + rr(-0.15, 0.15), WATER_Y + 0.1, frog.position.z + rr(-0.15, 0.15), 0x9fd8c2, { speed: 0.7, up: 1.4, life: 0.7, size: 0.1 });
  }
  if (frog.userData.hopT !== undefined) {
    frog.userData.hopT += dt;
    const h = frog.userData.hopT;
    if (h < 0.55) {
      frog.position.y = WATER_Y + 0.13 + Math.sin(h / 0.55 * Math.PI) * 0.45;
      frog.position.z = POND.y - 0.8 + frog.userData.z0 + frog.userData.dir * h * 0.3;
    } else {
      frog.position.y = WATER_Y + 0.13;
      frog.userData.hopT = undefined;
    }
  } else {
    frog.position.y = WATER_Y + 0.13 + Math.sin(t * 1.5708) * 0.015;
  }

  /* reticle follows the pointer onto the ground */
  if (pointerSeen) {
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.ray.intersectPlane(groundPlane, tmpV);
    if (hit && Math.abs(hit.x) < 45 && Math.abs(hit.z) < 45) {
      const inPond = Math.hypot(hit.x - POND.x, hit.z - POND.y) < POND_R - 0.4;
      reticlePt.set(hit.x, inPond ? WATER_Y : groundH(hit.x, hit.z), hit.z);
      reticle.position.copy(reticlePt).add(tmpV.set(0, 0.35, 0));
      reticle.visible = true;
    } else reticle.visible = false;
  }
  reticle.rotation.y = t * 1.5708;
  reticle.children[0].rotation.x = t * 2.3562;

  updateSparks(dt);
  if (camCurve) {
    camCurve.getPointAt((t % 8) / 8, camPos);
    camera.position.copy(camPos);
    camera.lookAt(0, 2, 0);
  }
  composer.render();
}

if (PUMP) {
  renderer.setAnimationLoop(null);
  camera.position.set(3, 7.5, 23.5); controls.update(); // the curated end-of-dolly framing
  window.__dbg = { camera, scene };
  window.__PUMP = (k, dt, shot) => {
    tick(dt, k * dt);
    return shot ? renderer.domElement.toDataURL('image/png') : null;
  };
} else {
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    tick(dt, clock.elapsedTime);
  });
}


</script>
