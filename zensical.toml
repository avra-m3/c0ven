# The published site (ADR-0047): the README, AGENTS.md and docs/, as Zensical renders them. Each page is in the
# navigation, under its folder, by its first heading; nothing here lists them. Building it: docs/guides/index.md.
[project]
site_name = "C0ven"
site_url = "https://avra-m3.github.io/c0ven/"
site_description = "An inference engine for Qwen3.8-Flash-Next on two Intel Arc Pro B60s"
repo_url = "https://github.com/avra-m3/c0ven"
repo_name = "avra-m3/c0ven"
edit_uri = "edit/main/"
docs_dir = "."
# The rest of the repository is code; tools.docs_links sends the pages' links to it to GitHub.
exclude_docs = """
/*
!/README.md
!/AGENTS.md
!/docs/
"""
site_dir = "_site"
extra_css = ["docs/stylesheets/logo-colours.css"]
# A page's links are checked as the site is built; strict stops the build on a broken one.
strict = true

[project.theme]
# The header in the primary colour, the logo's forest green.
variant = "classic"
logo = "docs/images/logo-mark.svg"
favicon = "docs/images/logo-mark.svg"
features = [
    "content.action.edit",
    "content.code.copy",
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown as GitHub reads it, so a page reads the same in both places. Left out of Zensical's defaults: the
# extensions that change text GitHub shows as typed, such as $ for maths and (c) for the copyright sign.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
# GitHub's heading anchors, which the pages' links use.
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
pygments_lang_class = true
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.magiclink"]
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]
[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
[project.markdown_extensions."pymdownx.tilde"]
[project.markdown_extensions."tools.docs_links"]
